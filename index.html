<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>カメラテスト</title>

<style>
body {
font-family: sans-serif;
padding: 30px;
}

button {
width: 100%;
padding: 20px;
font-size: 20px;
background: #1976d2;
color: white;
border: none;
border-radius: 12px;
}

video {
width: 100%;
margin-top: 20px;
background: #000;
}
</style>
</head>

<body>

<h1>カメラテスト</h1>

<button id="cameraBtn">
📷 カメラを起動
</button>

<p id="status">待機中</p>

<video id="video" autoplay playsinline></video>

<script>
document.getElementById("cameraBtn").addEventListener("click", async function () {

document.getElementById("status").textContent =
ボタンは正常に動いています;

try {

const stream =
await navigator.mediaDevices.getUserMedia({
video: {
facingMode: {
ideal: "environment"
}
},
audio: false
});

document.getElementById("video").srcObject =
stream;

document.getElementById("status").textContent =
✅ カメラ起動成功;

} catch (error) {

document.getElementById("status").textContent =
❌  + error.name + " : " + error.message;

}

});
</script>

</body>
</html>
