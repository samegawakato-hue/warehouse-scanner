<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1">																									
<title>カメラテスト</title>																									
																									
<style>																									
body {																									
font-family: -apple-system, BlinkMacSystemFont, sans-serif;																									
padding: 30px;																									
}																									
																									
button {																									
width: 100%;																									
padding: 25px;																									
font-size: 24px;																									
background: #1976d2;																									
color: white;																									
border: 0;																									
border-radius: 15px;																									
cursor: pointer;																									
}																									
																									
#status {																									
margin-top: 30px;																									
padding: 20px;																									
font-size: 22px;																									
font-weight: bold;																									
background: #eee;																									
border-radius: 10px;																									
}																									
																									
video {																									
width: 100%;																									
margin-top: 20px;																									
background: black;																									
border-radius: 15px;																									
}																									
</style>																									
</head>																									
																									
<body>																									
																									
<h1>カメラテスト</h1>																									
																									
<button id="start-btn">📷 カメラを起動</button>																									
																									
<div id="status">待機中</div>																									
																									
<video id="video" autoplay playsinline muted></video>																									
																									
<script>																									
const startBtn = document.getElementById('start-btn');																									
const statusEl = document.getElementById('status');																									
const videoEl = document.getElementById('video');																									
																									
startBtn.addEventListener('click', async () => {																									
statusEl.textContent = '① ボタン反応OK';																									
																									
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {																									
statusEl.textContent = '❌ カメラAPIが使えません（HTTPSで接続しているか確認してください）';																									
return;																									
}																									
																									
statusEl.textContent = '② カメラ許可を要求中';																									
																									
try {																									
const stream = await navigator.mediaDevices.getUserMedia({																									
video: { facingMode: 'environment' },																									
audio: false																									
});																									
																									
videoEl.srcObject = stream;																									
statusEl.textContent = '✅ カメラ起動成功';																									
} catch (error) {																									
statusEl.textContent = `❌ ${error.name} : ${error.message}`;																									
}																									
});																									
</script>																									
																									
</body>																									
</html>
