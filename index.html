<script>																									
																									
/* =========================================================																									
GAS URL																									
#ERROR!																									
																									
const GAS_URL =																									
https://script.google.com/macros/s/AKfycbzeR8CNs7gLSGvZi_C5QaKOarztj_wUrpcm6MX1aPI5dNVJoIRT7L-pb2CQpxqeYQxqtQ/exec;																									
																									
																									
/* =========================================================																									
基本変数																									
#ERROR!																									
																									
const codeReader = new ZXing.BrowserMultiFormatReader();																									
																									
let currentMode = "OUT_ITEM";																									
																									
let currentData = null;																									
																									
let activeStoreCode = null;																									
																									
let storeCounts = {};																									
																									
let isProcessing = false;																									
																									
let audioCtx = null;																									
																									
let currentInBarcode = null;																									
																									
																									
/* =========================================================																									
イベント																									
#ERROR!																									
																									
document																									
.getElementById("scanBtn")																									
.addEventListener("click", startScan);																									
																									
																									
/* =========================================================																									
モード変更																									
#ERROR!																									
																									
function switchMode(mode) {																									
																									
stopScan();																									
																									
currentMode = mode;																									
																									
document																									
.querySelectorAll(".mode-btn-full")																									
.forEach(btn => btn.classList.remove("active"));																									
																									
const titleEl =																									
document.getElementById("modeTitle");																									
																									
if (mode === "OUT_ITEM") {																									
																									
document																									
.getElementById("btnOutItem")																									
.classList.add("active");																									
																									
titleEl.innerText =																									
MODE: 出荷商品スキャン（総個数確認）;																									
																									
document																									
.getElementById("inArea")																									
.style.display = "none";																									
																									
}																									
																									
else if (mode === "OUT_STORE") {																									
																									
document																									
.getElementById("btnOutStore")																									
.classList.add("active");																									
																									
titleEl.innerText =																									
MODE: 出荷店舗スキャン（箱の店番）;																									
																									
document																									
.getElementById("inArea")																									
.style.display = "none";																									
																									
}																									
																									
else if (mode === "OUT_NEED") {																									
																									
titleEl.innerText =																									
MODE: 必要個数の商品スキャン;																									
																									
document																									
.getElementById("inArea")																									
.style.display = "none";																									
																									
}																									
																									
else if (mode === "IN_ITEM") {																									
																									
document																									
.getElementById("btnInItem")																									
.classList.add("active");																									
																									
titleEl.innerText =																									
MODE: 入荷商品スキャン（個数手入力）;																									
																									
document																									
.getElementById("inArea")																									
.style.display = "block";																									
																									
document																									
.getElementById("outArea")																									
.style.display = "none";																									
																									
}																									
}																									
																									
																									
/* =========================================================																									
並び順																									
#ERROR!																									
																									
function onSortChange() {																									
																									
if (!currentData) return;																									
																									
sortCurrentStores();																									
																									
renderProductData(currentData);																									
																									
const nextStore =																									
getNextRequiredStore();																									
																									
if (nextStore) {																									
																									
showStatus(																									
`並び順を変更しました。\n次は【${nextStore.storeName}】（箱No.${nextStore.storeNo}）をスキャンしてください`,																									
success																									
);																									
																									
}																									
}																									
																									
																									
function sortCurrentStores() {																									
																									
if (!currentData ||																									
!Array.isArray(currentData.stores)) {																									
return;																									
}																									
																									
const reverse =																									
document.getElementById("sortOrder").value === "true";																									
																									
currentData.stores.sort((a, b) => {																									
																									
const noA =																									
Number(a.storeNo) || 0;																									
																									
const noB =																									
Number(b.storeNo) || 0;																									
																									
return reverse																									
? noB - noA																									
: noA - noB;																									
});																									
}																									
																									
																									
/* =========================================================																									
スキャン開始																									
#ERROR!																									
																									
async function startScan() {																									
																									
if (isProcessing) return;																									
																									
isProcessing = false;																									
																									
try {																									
																									
if (!audioCtx) {																									
																									
audioCtx =																									
new (																									
window.AudioContext ||																									
window.webkitAudioContext																									
)();																									
}																									
																									
if (audioCtx.state === "suspended") {																									
																									
await audioCtx.resume();																									
}																									
																									
} catch (e) {}																									
																									
document																									
.getElementById("videoContainer")																									
.style.display = "block";																									
																									
try {																									
																									
await codeReader.decodeFromVideoDevice(																									
null,																									
video,																									
(result, err) => {																									
																									
if (																									
result &&																									
!isProcessing																									
) {																									
																									
isProcessing = true;																									
																									
const code =																									
String(result.text || "").trim();																									
																									
if (code) {																									
																									
handleScan(code);																									
																									
} else {																									
																									
isProcessing = false;																									
}																									
																									
}																									
																									
}																									
);																									
																									
} catch (e) {																									
																									
isProcessing = false;																									
																									
document																									
.getElementById("videoContainer")																									
.style.display = "none";																									
																									
triggerError(																									
カメラを起動できませんでした。\nSafariのカメラ許可を確認してください。																									
);																									
}																									
}																									
																									
																									
/* =========================================================																									
スキャン停止																									
#ERROR!																									
																									
function stopScan() {																									
																									
try {																									
																									
codeReader.reset();																									
																									
} catch (e) {}																									
																									
document																									
.getElementById("videoContainer")																									
.style.display = "none";																									
																									
isProcessing = false;																									
}																									
																									
																									
/* =========================================================																									
スキャン振り分け																									
#ERROR!																									
																									
function handleScan(code) {																									
																									
if (currentMode === "OUT_ITEM") {																									
																									
stopScan();																									
																									
fetchProductData(code);																									
																									
return;																									
}																									
																									
if (currentMode === "OUT_STORE") {																									
																									
stopScan();																									
																									
verifyStoreScan(code);																									
																									
return;																									
}																									
																									
if (currentMode === "OUT_NEED") {																									
																									
stopScan();																									
																									
countNeedItemScan(code);																									
																									
return;																									
}																									
																									
if (currentMode === "IN_ITEM") {																									
																									
stopScan();																									
																									
prepareInItem(code);																									
																									
return;																									
}																									
																									
}																									
																									
																									
/* =========================================================																									
JSONP通信共通関数																									
#ERROR!																									
																									
function jsonpRequest(params, timeoutMs = 15000) {																									
																									
return new Promise((resolve, reject) => {																									
																									
const callbackName =																									
jsonp_ +																									
Date.now() +																									
_ +																									
Math.floor(Math.random() * 100000);																									
																									
const script =																									
document.createElement("script");																									
																									
let finished = false;																									
																									
const cleanup = () => {																									
																									
if (finished) return;																									
																									
finished = true;																									
																									
clearTimeout(timer);																									
																									
try {																									
delete window[callbackName];																									
} catch (e) {																									
window[callbackName] = undefined;																									
}																									
																									
if (script.parentNode) {																									
script.parentNode.removeChild(script);																									
}																									
																									
};																									
																									
window[callbackName] = data => {																									
																									
cleanup();																									
																									
resolve(data);																									
};																									
																									
const query =																									
new URLSearchParams({																									
...params,																									
callback: callbackName,																									
_t: Date.now()																									
});																									
																									
script.src =																									
GAS_URL + "?" + query.toString();																									
																									
script.onerror = () => {																									
																									
cleanup();																									
																									
reject(																									
new Error("通信エラー")																									
);																									
};																									
																									
const timer =																									
setTimeout(() => {																									
																									
cleanup();																									
																									
reject(																									
new Error("通信タイムアウト")																									
);																									
																									
}, timeoutMs);																									
																									
document.body.appendChild(script);																									
																									
});																									
}																									
																									
																									
/* =========================================================																									
商品データ取得																									
#ERROR!																									
																									
async function fetchProductData(barcode) {																									
																									
showStatus(																									
商品データ取得中...,																									
success																									
);																									
																									
try {																									
																									
const reverse =																									
document																									
.getElementById("sortOrder")																									
.value;																									
																									
const data =																									
await jsonpRequest({																									
action: "product",																									
barcode: barcode,																									
reverse: reverse																									
});																									
																									
if (!data || !data.success) {																									
																									
triggerError(																									
data?.error ||																									
未登録の商品です																									
);																									
																									
return;																									
}																									
																									
currentData = data;																									
																									
if (!Array.isArray(currentData.stores)) {																									
																									
currentData.stores = [];																									
}																									
																									
storeCounts = {};																									
																									
currentData.stores.forEach(store => {																									
																									
const code =																									
String(store.storeCode);																									
																									
storeCounts[code] =																									
Number(store.completedQty) || 0;																									
});																									
																									
sortCurrentStores();																									
																									
renderProductData(currentData);																									
																									
const nextStore =																									
getNextRequiredStore();																									
																									
if (!nextStore) {																									
																									
showStatus(																									
🎉 この商品は全店舗完了済みです,																									
success																									
);																									
																									
switchMode("OUT_ITEM");																									
																									
return;																									
}																									
																									
switchMode("OUT_STORE");																									
																									
showStatus(																									
`① 商品確認OK\n次は【${nextStore.storeName}】\n箱No.${nextStore.storeNo} をスキャンしてください`,																									
success																									
);																									
																									
} catch (e) {																									
																									
triggerError(																									
商品データを取得できませんでした。\nGASのURL・デプロイ設定を確認してください。																									
);																									
}																									
}																									
																									
																									
/* =========================================================																									
次の未完了店舗																									
#ERROR!

const requiredQty =

const oldCount =

const newCount =

updateStoreUI();

if (!saved) {

updateStoreUI();																									
																									
triggerError(

);																									
																									
return;																									
}																									
																									
const allCompleted =																									
currentData.stores.every(store => {																									
																									
const code =																									
String(store.storeCode);																									
																									
return (																									
Number(storeCounts[code]) || 0																									
) >= (																									
Number(store.qty) || 0																									
);																									
});																									
																									
if (allCompleted) {

🎉 この商品の全店舗へのピッキングが完了しました！\n次の商品をスキャンしてください。,																									
success																									
);																									
																									
currentData = null;																									
																									
activeStoreCode = null;																									
																									
storeCounts = {};																									
																									
document																									
.getElementById("outArea")

switchMode("OUT_ITEM");

const nextStore =

);

}																									
																									
																									
/* =========================================================

storeCode,																									
qty

);																									
																									
return false;

return true;																									
																									
} catch (e) {

}																									
}

/* =========================================================
   UI更新
========================================================= */

function updateStoreUI() {

    if (!currentData) return;

    const nextStore =
        getNextRequiredStore();

    let totalPicked = 0;

    currentData.stores.forEach(store => {

        const code =
            String(store.storeCode);

        const count =
            Number(storeCounts[code]) || 0;

        const required =
            Number(store.qty) || 0;

        totalPicked +=
            Math.min(
                count,
                required
            );

        const safeCode =
            safeId(code);

        const card =
            document.getElementById(
                `card-${safeCode}`
            );

        const countEl =
            document.getElementById(
                `count-${safeCode}`
            );

        if (countEl) {

            countEl.innerText =
                count;
        }

        if (card) {

            if (count >= required) {

                card.className =
                    store-card done"";"																									
																									
}																									
																									
else if (																									
nextStore &&																									
String(nextStore.storeCode) ===																									
code																									
) {																									
																									
card.className =																									
store-card next-target;																									
																									
}																									
																									
else {																									
																									
card.className =																									
store-card;																									
}																									
}																									
																									
});																									
																									
document																									
.getElementById("pickedQty")																									
.innerText =																									
totalPicked;																									
																									
const totalQty =																									
Number(currentData.totalQty) || 0;																									
																									
let percentage = 0;																									
																									
if (totalQty > 0) {																									
																									
percentage =																									
(totalPicked / totalQty) * 100;																									
}																									
																									
percentage =																									
Math.max(																									
0,																									
Math.min(																									
100,																									
percentage																									
)																									
);																									
																									
document																									
.getElementById("progressFill")																									
.style.width =																									
percentage + "%";																									
}																									
																									
																									
/* =========================================================																									
エラー通知																									
#ERROR!																									
																									
function triggerError(msg) {																									
																									
showStatus(																									
msg,																									
error																									
);																									
																									
try {																									
																									
const ctx =																									
audioCtx ||																									
new (																									
window.AudioContext ||																									
window.webkitAudioContext																									
)();																									
																									
if (ctx.state === "suspended") {																									
																									
ctx.resume();																									
}																									
																									
const oscillator =																									
ctx.createOscillator();																									
																									
const gain =																									
ctx.createGain();																									
																									
oscillator.type =																									
sawtooth;																									
																									
oscillator.frequency																									
.setValueAtTime(																									
880,																									
ctx.currentTime																									
);																									
																									
gain.gain																									
.setValueAtTime(																									
0.35,																									
ctx.currentTime																									
);																									
																									
oscillator.connect(gain);																									
																									
gain.connect(																									
ctx.destination																									
);																									
																									
oscillator.start();																									
																									
oscillator.stop(																									
ctx.currentTime + 0.35																									
);																									
																									
} catch (e) {}																									
																									
if (navigator.vibrate) {																									
																									
navigator.vibrate(																									
[200,100,200,100,400]																									
);																									
}																									
}

/* =========================================================

#ERROR!																									
																									
function safeId(value) {																									
																									
return String(value)																									
.replace(																									
/[^a-zA-Z0-9_-]/g,																									
_																									
);																									
}																									
																									
																									
function escapeHtml(value) {																									
																									
return String(																									
value ?? ""																									
)																									
.replace(/&/g, "&amp;")																									
.replace(/</g, "&lt;")																									
.replace(/>/g, "&gt;")																									
.replace(/"/g, "&quot;")																									
.replace(/'/g, "&#039;");																									
}
