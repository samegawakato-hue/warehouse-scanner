<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1">																									
																									
<title>倉庫バーコードスキャナー</title>																									
																									
<style>																									
body {																									
font-family: -apple-system, BlinkMacSystemFont, sans-serif;																									
margin: 0;																									
background: #f4f5f7;																									
padding: 25px;																									
}																									
																									
h1 {																									
font-size: 28px;																									
text-align: center;																									
}																									
																									
.cameraButton {																									
display: block;																									
width: 100%;																									
box-sizing: border-box;																									
padding: 22px;																									
margin-top: 30px;																									
																									
background: #1976d2;																									
color: white;																									
																									
border-radius: 14px;																									
																									
font-size: 22px;																									
font-weight: bold;																									
text-align: center;																									
																									
cursor: pointer;																									
}																									
																									
#cameraInput {																									
display: none;																									
}																									
																									
#status {																									
margin-top: 25px;																									
padding: 18px;																									
background: white;																									
border-radius: 12px;																									
																									
font-size: 20px;																									
font-weight: bold;																									
}																									
																									
#preview {																									
width: 100%;																									
margin-top: 20px;																									
border-radius: 12px;																									
display: none;																									
}																									
</style>																									
</head>																									
																									
<body>																									
																									
<h1>倉庫バーコードスキャナー</h1>																									
																									
<label class="cameraButton" for="cameraInput">																									
📷 バーコードを撮影																									
</label>																									
																									
<input																									
id="cameraInput"																									
type="file"																									
accept="image/*"																									
capture="environment"																									
>																									
																									
<div id="status">																									
バーコードを撮影してください																									
</div>																									
																									
<img id="preview">																									
																									
<script>																									
																									
const input =																									
document.getElementById("cameraInput");																									
																									
const preview =																									
document.getElementById("preview");																									
																									
const status =																									
document.getElementById("status");																									
																									
																									
input.addEventListener("change", function() {																									
																									
if (!input.files || !input.files[0]) {																									
return;																									
}																									
																									
const file =																									
input.files[0];																									
																									
const url =																									
URL.createObjectURL(file);																									
																									
preview.src = url;																									
																									
preview.style.display =																									
block;																									
																									
status.textContent =																									
✅ カメラ撮影成功;																									
																									
});																									
																									
</script>																									
																									
</body>																									
</html>
