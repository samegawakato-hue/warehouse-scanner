<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1">																									
<title>カメラテスト</title>																									
																									
<style>																									
body {																									
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;																									
margin: 0;																									
padding: 24px;																									
background: #f4f5f7;																									
color: #111;																									
}																									
																									
h1 {																									
font-size: 34px;																									
margin-bottom: 24px;																									
}																									
																									
button {																									
width: 100%;																									
padding: 20px;																									
font-size: 22px;																									
font-weight: 700;																									
background: #1976d2;																									
color: white;																									
border: none;																									
border-radius: 14px;																									
}																									
																									
#status {																									
margin-top: 22px;																									
font-size: 22px;																									
font-weight: 700;																									
padding: 14px;																									
background: white;																									
border-radius: 12px;																									
}																									
																									
video {																									
width: 100%;																									
margin-top: 20px;																									
background: black;																									
border-radius: 14px;																									
}																									
</style>																									
</head>																									
																									
<body>																									
																									
<h1>カメラテスト</h1>																									
																									
<button onclick="startCamera()">																									
📷 カメラを起動																									
</button>																									
																									
<div id="status">																									
JavaScript読込OK																									
</div>																									
																									
<video																									
id="video"																									
autoplay																									
playsinline																									
muted>																									
</video>																									
																									
<script>																									
async function startCamera() {																									
																									
const status =																									
document.getElementById("status");																									
																									
status.textContent =																									
① ボタン反応OK;																									
																									
try {																									
																									
if (																									
!navigator.mediaDevices ||																									
!navigator.mediaDevices.getUserMedia																									
) {																									
																									
status.textContent =																									
❌ このブラウザではカメラAPIが使えません;																									
																									
return;																									
}																									
																									
status.textContent =																									
② カメラ許可を要求中;																									
																									
const stream =																									
await navigator.mediaDevices.getUserMedia({																									
video: {																									
facingMode: {																									
ideal: "environment"																									
}																									
},																									
audio: false																									
});																									
																									
document																									
.getElementById("video")																									
.srcObject = stream;																									
																									
status.textContent =																									
✅ カメラ起動成功;																									
																									
} catch (error) {																									
																									
status.textContent =																									
❌  +																									
error.name +																									
 :  +																									
error.message;																									
																									
}																									
																									
}																									
</script>																									
																									
</body>																									
</html>
