<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">																									
<title>バーコードスキャナー</title>																									
																									
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>																									
																									
<style>																									
body {																									
font-family: -apple-system, BlinkMacSystemFont, sans-serif;																									
margin: 0;																									
background: #f4f5f7;																									
}																									
																									
.wrap {																									
max-width: 720px;																									
margin: 0 auto;																									
padding: 16px;																									
}																									
																									
h1 {																									
text-align: center;																									
font-size: 24px;																									
}																									
																									
.card {																									
background: white;																									
padding: 16px;																									
border-radius: 14px;																									
}																									
																									
button {																									
width: 100%;																									
padding: 16px;																									
margin-top: 10px;																									
font-size: 18px;																									
font-weight: bold;																									
border: 0;																									
border-radius: 10px;																									
}																									
																									
.start {																									
background: #1976d2;																									
color: white;																									
}																									
																									
.stop {																									
background: #555;																									
color: white;																									
}																									
																									
#reader {																									
width: 100%;																									
margin-top: 14px;																									
}																									
																									
#status {																									
margin-top: 12px;																									
padding: 12px;																									
background: #eef1f4;																									
border-radius: 10px;																									
}																									
																									
#result {																									
margin-top: 12px;																									
font-size: 26px;																									
font-weight: bold;																									
word-break: break-all;																									
}																									
</style>																									
</head>																									
																									
<body>																									
<div class="wrap">																									
																									
<h1>バーコードスキャナー</h1>																									
																									
<div class="card">																									
																									
<button class="start" onclick="startScanner()">																									
📷 バーコードをスキャン																									
</button>																									
																									
<button																									
id="stopBtn"																									
class="stop"																									
style="display:none"																									
onclick="stopScanner()">																									
カメラを閉じる																									
</button>																									
																									
<div id="reader"></div>																									
																									
<div id="status">																									
「バーコードをスキャン」を押してください。																									
</div>																									
																									
<div id="result">																									
未読取																									
</div>																									
																									
</div>																									
</div>																									
																									
<script>																									
let scanner = null;																									
let running = false;																									
																									
async function startScanner() {																									
if (running) return;																									
																									
document.getElementById("status").textContent =																									
カメラを起動しています…;																									
																									
try {																									
scanner = new Html5Qrcode("reader");																									
																									
await scanner.start(																									
{ facingMode: "environment" },																									
{																									
fps: 12,																									
qrbox: function(width, height) {																									
return {																									
width: Math.floor(width * 0.9),																									
height: Math.floor(height * 0.35)																									
};																									
},																									
aspectRatio: 1.777778																									
},																									
onScanSuccess,																									
function() {}																									
);																									
																									
running = true;																									
																									
document.getElementById("stopBtn").style.display = "block";																									
																									
document.getElementById("status").textContent =																									
バーコードを枠内に合わせてください。;																									
																									
} catch (e) {																									
																									
document.getElementById("status").textContent =																									
カメラ起動エラー： + e;																									
}																									
}																									
																									
async function stopScanner() {																									
if (!scanner || !running) return;																									
																									
try {																									
await scanner.stop();																									
scanner.clear();																									
} catch (e) {}																									
																									
running = false;																									
																									
document.getElementById("stopBtn").style.display = "none";																									
																									
document.getElementById("status").textContent =																									
カメラを停止しました。;																									
}																									
																									
async function onScanSuccess(decodedText) {																									
																									
document.getElementById("result").textContent =																									
decodedText;																									
																									
document.getElementById("status").textContent =																									
✅ 読み取り成功;																									
																									
if (navigator.vibrate) {																									
navigator.vibrate(120);																									
}																									
																									
await stopScanner();																									
}																									
</script>																									
																									
</body>																									
</html>
