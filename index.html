<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1.0">																									
<title>ピッキング＆入荷管理</title>																									
<script src="https://unpkg.com/@zxing/library@latest"></script>																									
<style>																									
body { font-family: -apple-system, sans-serif; background: #f4f6f9; margin: 0; padding: 12px; }																									
.card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }																									
.btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }																									
.mode-btn { background: #e2e8f0; color: #334155; border: none; padding: 12px 5px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }																									
.mode-btn.active { background: #2563eb; color: #fff; }																									
.btn-action { background: #10b981; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; }																									
.status { padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 8px; text-align: center; }																									
.status.success { background: #dcfce7; color: #15803d; }																									
.status.error { background: #fee2e2; color: #dc2626; font-size: 16px; }																									
.big-num { font-size: 28px; font-weight: bold; color: #2563eb; }																									
.store-card { border: 2px solid #cbd5e1; border-radius: 8px; padding: 10px; margin-top: 6px; }																									
.store-card.active { border-color: #2563eb; background: #eff6ff; }																									
.store-card.done { border-color: #10b981; background: #f0fdf4; opacity: 0.6; }																									
video { width: 100%; border-radius: 8px; }																									
input[type="number"] { width: 80px; font-size: 18px; padding: 6px; text-align: center; border: 1px solid #ccc; border-radius: 6px; }																									
</style>																									
</head>																									
<body>																									
																									
<div class="btn-grid">																									
<button id="btnOutItem" class="mode-btn active" onclick="switchMode('OUT_ITEM')">📦 出荷商品</button>																									
<button id="btnOutStore" class="mode-btn" onclick="switchMode('OUT_STORE')">🏪 出荷店舗</button>																									
<button id="btnInItem" class="mode-btn" onclick="switchMode('IN_ITEM')">📥 入荷商品</button>																									
</div>																									
																									
<div class="card">																									
<div id="modeTitle" style="font-weight:bold; font-size:14px; margin-bottom:8px; color:#2563eb;">MODE: 出荷商品スキャン（総個数確認）</div>																									
<button id="scanBtn" class="btn-action">📷 スキャン開始</button>																									
																									
<div id="videoContainer" style="display:none; margin-top:10px;">																									
<video id="video"></video>																									
<button onclick="stopScan()" class="mode-btn" style="width:100%; margin-top:5px;">キャンセリスキャン</button>																									
</div>																									
																									
<div id="status" class="status" style="display:none;"></div>																									
</div>																									
																									
<div id="outArea" class="card" style="display:none;">																									
<div style="text-align:center;">																									
<h3 id="itemTitle" style="margin:0;"></h3>																									
<div id="itemSub" style="color:#64748b; font-size:12px;"></div>																									
<div style="margin-top:6px;">本日出荷合計: <span id="totalQty" class="big-num">0</span> 個</div>																									
</div>																									
<hr style="border:0; border-top:1px solid #eee; margin:10px 0;">																									
<div id="storeList"></div>																									
</div>																									
																									
<div id="inArea" class="card" style="display:none;">																									
<h3>入荷登録</h3>																									
<div id="inItemInfo" style="font-weight:bold; margin-bottom:10px;">商品をスキャンしてください</div>																									
<div id="inInputForm" style="display:none; align-items:center; gap:10px;">																									
<label>入荷数量:</label>																									
<input type="number" id="inQtyInput" value="1" min="1">																									
<button class="btn-action" style="width:auto; padding:8px 16px;" onclick="submitInQty()">確定</button>																									
</div>																									
</div>																									
																									
<script>																									
const GAS_URL = "https://script.google.com/macros/s/AKfycbzeR8CNs7gLSGvZi_C5QaKOarztj_wUrpcm6MX1aPI5dNVJoIRT7L-pb2CQpxqeYQxqtQ/exec";																									
																									
const codeReader = new ZXing.BrowserMultiFormatReader();																									
let currentMode = 'OUT_ITEM';																									
let currentData = null;																									
let activeStoreCode = null;																									
let storeCounts = {};																									
let isProcessing = false;																									
let audioCtx = null;																									
																									
document.getElementById('scanBtn').addEventListener('click', startScan);																									
																									
function switchMode(mode) {																									
currentMode = mode;																									
document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));																									
document.getElementById('status').style.display = 'none';																									
																									
const titleEl = document.getElementById('modeTitle');																									
if (mode === 'OUT_ITEM') {																									
document.getElementById('btnOutItem').classList.add('active');																									
titleEl.innerText = 'MODE: 出荷商品スキャン（総個数確認）';																									
document.getElementById('inArea').style.display = 'none';																									
} else if (mode === 'OUT_STORE') {																									
document.getElementById('btnOutStore').classList.add('active');																									
titleEl.innerText = 'MODE: 出荷店舗スキャン（箱の店番）';																									
document.getElementById('inArea').style.display = 'none';																									
} else if (mode === 'IN_ITEM') {																									
document.getElementById('btnInItem').classList.add('active');																									
titleEl.innerText = 'MODE: 入荷商品スキャン（個数手入力）';																									
document.getElementById('inArea').style.display = 'block';																									
document.getElementById('outArea').style.display = 'none';																									
}																									
}																									
																									
function startScan() {																									
isProcessing = false;																									
																									
// タップ操作時にブラウザの音声再生ブロックを解除																									
try {																									
if (!audioCtx) {																									
audioCtx = new (window.AudioContext || window.webkitAudioContext)();																									
}																									
if (audioCtx.state === 'suspended') {																									
audioCtx.resume();																									
}																									
} catch (e) {																									
console.error('AudioInit Error:', e);																									
}																									
																									
document.getElementById('videoContainer').style.display = 'block';																									
codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {																									
if (result && !isProcessing) {																									
isProcessing = true;																									
handleScan(result.text);																									
}																									
});																									
}																									
																									
function stopScan() {																									
codeReader.reset();																									
document.getElementById('videoContainer').style.display = 'none';																									
isProcessing = false;																									
}																									
																									
function handleScan(code) {																									
if (currentMode === 'OUT_ITEM') {																									
stopScan();																									
fetchProductData(code);																									
} else if (currentMode === 'OUT_STORE') {																									
stopScan();																									
verifyStoreScan(code);																									
} else if (currentMode === 'OUT_NEED') {																									
countNeedItemScan(code);																									
} else if (currentMode === 'IN_ITEM') {																									
stopScan();																									
prepareInItem(code);																									
}																									
}																									
																									
function fetchProductData(barcode) {																									
showStatus('商品データ取得中...', 'success');																									
																									
const callbackName = 'cb_' + Date.now();																									
const script = document.createElement('script');																									
																									
const timer = setTimeout(() => {																									
cleanup();																									
triggerError('通信タイムアウト：GASの設定を確認してください');																									
}, 10000);																									
																									
function cleanup() {																									
clearTimeout(timer);																									
if (window[callbackName]) delete window[callbackName];																									
if (script.parentNode) script.parentNode.removeChild(script);																									
}																									
																									
window[callbackName] = function(data) {																									
cleanup();																									
if (data.success) {																									
currentData = data;																									
storeCounts = {};																									
data.stores.forEach(s => storeCounts[s.storeCode] = 0);																									
																									
renderProductData(data);																									
switchMode('OUT_STORE');																									
stopScan();																									
showStatus('1. 商品確認完了。「スキャン開始」を押して出荷店舗のバーコードをスキャンしてください', 'success');																									
} else {																									
triggerError(data.error || '未登録の商品です');																									
}																									
};																									
																									
script.src = `${GAS_URL}?action=product&barcode=${encodeURIComponent(barcode)}&callback=${callbackName}`;																									
script.onerror = function() {																									
cleanup();																									
triggerError('通信エラー：接続できませんでした');																									
};																									
																									
document.body.appendChild(script);																									
}																									
																									
function verifyStoreScan(storeCode) {																									
if (!currentData) {																									
triggerError('先に「出荷商品」をスキャンしてください');																									
return;																									
}																									
																									
const targetStore = currentData.stores.find(s => String(s.storeCode) === String(storeCode));																									
if (!targetStore) {																									
triggerError('❌ 対象外の店舗箱です！');																									
return;																									
}																									
																									
const currentCount = storeCounts[storeCode] || 0;																									
if (currentCount >= targetStore.qty) {																									
triggerError('⚠️ この店舗の必要個数は満たしています！別の店舗をスキャンしてください');																									
return;																									
}																									
																									
activeStoreCode = storeCode;																									
currentMode = 'OUT_NEED';																									
document.getElementById('modeTitle').innerText = `MODE: 商品必要個数をスキャン中 (${targetStore.storeName})`;																									
showStatus(`2. 店舗確認OK (${targetStore.storeName}): 「スキャン開始」を押して商品をあと ${targetStore.qty - currentCount} 回スキャンしてください`, 'success');																									
}																									
																									
function countNeedItemScan(barcode) {																									
if (barcode !== currentData.barcode && barcode !== currentData.productCode) {																									
stopScan();																									
triggerError('❌ 違う商品です！正しい商品をスキャンしてください');																									
return;																									
}																									
																									
const targetStore = currentData.stores.find(s => String(s.storeCode) === String(activeStoreCode));																									
storeCounts[activeStoreCode]++;																									
																									
const count = storeCounts[activeStoreCode];																									
updateStoreUI(activeStoreCode, count, targetStore.qty);																									
																									
stopScan(); // 1個読み取るたびにカメラを停止（誤連続カウント防止）																									
																									
if (count >= targetStore.qty) {																									
// ★店舗の必要数に達したら、自動的に「次の店舗のバーコードスキャン待ち」状態へ移行																									
switchMode('OUT_STORE');																									
showStatus(`🎉 ${targetStore.storeName} への投入完了！「スキャン開始」を押して次の店舗のバーコードをスキャンしてください`, 'success');																									
} else {																									
showStatus(`3. OK (${count}/${targetStore.qty}個) - 「スキャン開始」を押して次の1個をスキャン`, 'success');																									
}																									
}																									
																									
function prepareInItem(barcode) {																									
document.getElementById('inItemInfo').innerText = `バーコード: ${barcode}`;																									
document.getElementById('inInputForm').style.display = 'flex';																									
showStatus('数量を入力して確定を押してください', 'success');																									
}																									
																									
function submitInQty() {																									
const qty = document.getElementById('inQtyInput').value;																									
alert(`入荷登録完了: ${qty} 個`);																									
document.getElementById('inInputForm').style.display = 'none';																									
document.getElementById('inItemInfo').innerText = '商品をスキャンしてください';																									
showStatus('入荷登録が完了しました', 'success');																									
}																									
																									
function triggerError(msg) {																									
showStatus(msg, 'error');																									
																									
try {																									
const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();																									
if (ctx.state === 'suspended') {																									
ctx.resume();																									
}																									
																									
const osc = ctx.createOscillator();																									
const gain = ctx.createGain();																									
																									
osc.type = 'sawtooth';																									
osc.frequency.setValueAtTime(880, ctx.currentTime);																									
																									
gain.gain.setValueAtTime(0.5, ctx.currentTime);																									
																									
osc.connect(gain);																									
gain.connect(ctx.destination);																									
																									
osc.start();																									
osc.stop(ctx.currentTime + 0.4);																									
} catch (e) {																									
console.error('Audio Error:', e);																									
}																									
																									
if (navigator.vibrate) {																									
navigator.vibrate([200, 100, 200, 100, 400]);																									
}																									
}																									
																									
function renderProductData(data) {																									
document.getElementById('outArea').style.display = 'block';																									
document.getElementById('itemTitle').innerText = `${data.model} / ${data.color}`;																									
document.getElementById('itemSub').innerText = `商品コード: ${data.productCode}`;																									
document.getElementById('totalQty').innerText = data.totalQty;																									
																									
const listEl = document.getElementById('storeList');																									
listEl.innerHTML = '';																									
data.stores.forEach(store => {																									
const div = document.createElement('div');																									
div.className = 'store-card';																									
div.id = `card-${store.storeCode}`;																									
div.innerHTML = `																									
<div style="font-weight:bold;">No.${store.storeNo} ${store.storeName} (店番: ${store.storeCode})</div>																									
<div style="font-size:18px; font-weight:bold; margin-top:4px;">																									
投入数: <span id="count-${store.storeCode}">0</span> / ${store.qty} 個																									
</div>																									
`;																									
listEl.appendChild(div);																									
});																									
}																									
																									
function updateStoreUI(storeCode, count, max) {																									
const card = document.getElementById(`card-${storeCode}`);																									
document.getElementById(`count-${storeCode}`).innerText = count;																									
if (count >= max) {																									
card.className = 'store-card done';																									
} else {																									
card.className = 'store-card active';																									
}																									
}																									
																									
function showStatus(msg, type) {																									
const el = document.getElementById('status');																									
el.innerText = msg;																									
el.className = `status ${type}`;																									
el.style.display = 'block';																									
}																									
</script>																									
</body>																									
</html>
