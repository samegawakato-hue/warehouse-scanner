<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1.0">																									
<title>店舗別仕分けピッキング</title>																									
<script src="https://unpkg.com/@zxing/library@latest"></script>																									
<style>																									
body { font-family: -apple-system, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }																									
.card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }																									
.btn { background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }																									
.status { padding: 12px; border-radius: 8px; font-weight: bold; margin-top: 10px; text-align: center; }																									
.status.success { background: #dcfce7; color: #15803d; }																									
.status.error { background: #fee2e2; color: #dc2626; font-size: 18px; }																									
.mode-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 8px; }																									
.mode-item { background: #e0f2fe; color: #0369a1; }																									
.mode-store { background: #fef3c7; color: #b45309; }																									
.big-num { font-size: 36px; font-weight: bold; color: #2563eb; }																									
.store-card { border: 2px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 8px; }																									
.store-card.active { border-color: #2563eb; background: #eff6ff; }																									
.store-card.done { border-color: #10b981; background: #f0fdf4; opacity: 0.6; }																									
video { width: 100%; border-radius: 8px; }																									
</style>																									
</head>																									
<body>																									
																									
<div class="card">																									
<div id="modeBadge" class="mode-badge mode-item">STEP 1: 商品スキャン</div>																									
<button id="scanBtn" class="btn">📷 バーコードをスキャン</button>																									
<div id="videoContainer" style="display:none; margin-top:10px;">																									
<video id="video"></video>																									
<button id="closeScanBtn" class="btn" style="background:#64748b; margin-top:5px;">キャンセル</button>																									
</div>																									
<div id="status" class="status" style="display:none;"></div>																									
</div>																									
																									
<div id="resultArea" style="display:none;">																									
<div class="card" style="text-align:center;">																									
<h2 id="itemTitle" style="margin:0;"></h2>																									
<div id="itemSub" style="color:#64748b; font-size:13px; margin-top:4px;"></div>																									
<div style="margin-top:10px;">出荷合計: <span id="totalQty" class="big-num">0</span> 個</div>																									
</div>																									
																									
<div class="card">																									
<h3 style="margin:0 0 10px 0;">対象店舗一覧</h3>																									
<div id="storeList"></div>																									
</div>																									
</div>																									
																									
<script>																									
const GAS_URL = "https://script.google.com/macros/s/AKfycbz1K5bK4K5-YOUR-ID-HERE/exec";																									
const codeReader = new ZXing.BrowserMultiFormatReader();																									
																									
let currentMode = 'ITEM'; // 'ITEM' または 'STORE'																									
let currentData = null;																									
let storeCounts = {};																									
																									
document.getElementById('scanBtn').addEventListener('click', startScan);																									
document.getElementById('closeScanBtn').addEventListener('click', stopScan);																									
																									
function startScan() {																									
document.getElementById('videoContainer').style.display = 'block';																									
codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {																									
if (result) {																									
handleScan(result.text);																									
}																									
});																									
}																									
																									
function stopScan() {																									
codeReader.reset();																									
document.getElementById('videoContainer').style.display = 'none';																									
}																									
																									
function handleScan(code) {																									
if (currentMode === 'ITEM') {																									
stopScan();																									
fetchProductData(code);																									
} else if (currentMode === 'STORE') {																									
processStoreScan(code);																									
}																									
}																									
																									
function fetchProductData(barcode) {																									
showStatus('商品データ取得中...', 'success');																									
const script = document.createElement('script');																									
const callbackName = 'cb_' + Date.now();																									
																									
window[callbackName] = function(data) {																									
delete window[callbackName];																									
document.body.removeChild(script);																									
if (data.success) {																									
currentData = data;																									
storeCounts = {};																									
data.stores.forEach(s => storeCounts[s.storeCode] = 0);																									
																									
renderProductData(data);																									
setMode('STORE');																									
showStatus('箱（店番）のバーコードをスキャンしてください', 'success');																									
} else {																									
triggerError('未登録の商品です');																									
}																									
};																									
																									
script.src = `${GAS_URL}?action=product&barcode=${encodeURIComponent(barcode)}&callback=${callbackName}`;																									
document.body.appendChild(script);																									
}																									
																									
function processStoreScan(storeCode) {																									
if (!currentData) return;																									
																									
const targetStore = currentData.stores.find(s => String(s.storeCode) === String(storeCode));																									
																									
if (!targetStore) {																									
triggerError('❌ 対象外の店舗箱です！');																									
return;																									
}																									
																									
const currentCount = storeCounts[storeCode] || 0;																									
if (currentCount >= targetStore.qty) {																									
triggerError('⚠️ この店舗は既に必要個数に達しています！');																									
return;																									
}																									
																									
// 正常投入																									
storeCounts[storeCode]++;																									
updateStoreUI(targetStore.storeCode, storeCounts[storeCode], targetStore.qty);																									
showStatus(`OK: ${targetStore.storeName} (${storeCounts[storeCode]}/${targetStore.qty}個)`, 'success');																									
																									
// 全体完了チェック																									
checkAllCompleted();																									
}																									
																									
function triggerError(msg) {																									
showStatus(msg, 'error');																									
// エラー音（ビープ音）生成																									
const ctx = new (window.AudioContext || window.webkitAudioContext)();																									
const osc = ctx.createOscillator();																									
osc.type = 'sawtooth';																									
osc.frequency.setValueAtTime(440, ctx.currentTime);																									
osc.connect(ctx.destination);																									
osc.start();																									
osc.stop(ctx.currentTime + 0.5);																									
																									
// バイブレーション（スマホのみ）																									
if (navigator.vibrate) {																									
navigator.vibrate([200, 100, 200, 100, 400]);																									
}																									
}																									
																									
function setMode(mode) {																									
currentMode = mode;																									
const badge = document.getElementById('modeBadge');																									
if (mode === 'ITEM') {																									
badge.innerText = 'STEP 1: 商品スキャン';																									
badge.className = 'mode-badge mode-item';																									
} else {																									
badge.innerText = 'STEP 2: 店舗箱（店番）スキャン継続中';																									
badge.className = 'mode-badge mode-store';																									
}																									
}																									
																									
function renderProductData(data) {																									
document.getElementById('resultArea').style.display = 'block';																									
document.getElementById('itemTitle').innerText = `${data.model} / ${data.color}`;																									
document.getElementById('itemSub').innerText = `商品コード: ${data.productCode}`;																									
document.getElementById('totalQty').innerText = data.totalQty;																									
																									
const listEl = document.getElementById('storeList');																									
listEl.innerHTML = '';																									
data.stores.forEach(store => {																									
const div = document.createElement('div');																									
div.className = 'store-card';																									
div.id = `card-${store.storeCode}`;																									
div.innerHTML = `																									
<div style="font-weight:bold;">No.${store.storeNo} ${store.storeName} (店番: ${store.storeCode})</div>																									
<div style="font-size:20px; font-weight:bold; margin-top:4px;">																									
投入数: <span id="count-${store.storeCode}">0</span> / ${store.qty} 個																									
</div>																									
`;																									
listEl.appendChild(div);																									
});																									
}																									
																									
function updateStoreUI(storeCode, count, max) {																									
const card = document.getElementById(`card-${storeCode}`);																									
document.getElementById(`count-${storeCode}`).innerText = count;																									
																									
if (count >= max) {																									
card.className = 'store-card done';																									
} else {																									
card.className = 'store-card active';																									
}																									
}																									
																									
function checkAllCompleted() {																									
let isAllDone = currentData.stores.every(s => (storeCounts[s.storeCode] || 0) >= s.qty);																									
if (isAllDone) {																									
showStatus('🎉 この商品の全店舗ピッキングが完了しました！', 'success');																									
stopScan();																									
setTimeout(() => {																									
setMode('ITEM');																									
document.getElementById('resultArea').style.display = 'none';																									
}, 2500);																									
}																									
}																									
																									
function showStatus(msg, type) {																									
const el = document.getElementById('status');																									
el.innerText = msg;																									
el.className = `status ${type}`;																									
el.style.display = 'block';																									
}																									
</script>																									
</body>																									
</html>
