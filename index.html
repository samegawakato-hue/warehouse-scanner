<!doctype html>																									
<html lang="ja">																									
<head>																									
<meta charset="utf-8">																									
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">																									
<title>倉庫バーコードスキャナー</title>																									
																									
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>																									
																									
<style>																									
body {																									
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;																									
margin: 0;																									
background: #f5f6f8;																									
color: #111;																									
}																									
																									
.wrap {																									
max-width: 760px;																									
margin: auto;																									
padding: 14px;																									
}																									
																									
h1 {																									
text-align: center;																									
font-size: 24px;																									
margin: 10px 0 16px;																									
}																									
																									
.card {																									
background: #fff;																									
border-radius: 14px;																									
padding: 14px;																									
margin-bottom: 14px;																									
box-shadow: 0 1px 4px rgba(0,0,0,.08);																									
}																									
																									
button {																									
width: 100%;																									
padding: 16px;																									
border: 0;																									
border-radius: 10px;																									
font-size: 18px;																									
font-weight: 700;																									
margin-top: 10px;																									
}																									
																									
.blue {																									
background: #1976d2;																									
color: #fff;																									
}																									
																									
.gray {																									
background: #555;																									
color: #fff;																									
}																									
																									
#reader {																									
width: 100%;																									
margin-top: 12px;																									
overflow: hidden;																									
border-radius: 12px;																									
}																									
																									
#status {																									
margin-top: 10px;																									
padding: 12px;																									
background: #eef1f4;																									
border-radius: 10px;																									
font-size: 16px;																									
}																									
																									
#result {																									
font-size: 28px;																									
font-weight: 800;																									
word-break: break-all;																									
margin-top: 8px;																									
}																									
																									
.hint {																									
font-size: 15px;																									
line-height: 1.5;																									
}																									
</style>																									
</head>																									
																									
<body>																									
																									
<div class="wrap">																									
																									
<h1>倉庫バーコードスキャナー</h1>																									
																									
<div class="card">																									
																									
<button																									
class="blue"																									
onclick="startScanner()">																									
📷 バーコードをスキャン																									
</button>																									
																									
<button																									
id="stopBtn"																									
class="gray"																									
style="display:none"																									
onclick="stopScanner()">																									
カメラを閉じる																									
</button>																									
																									
<div id="reader"></div>																									
																									
<div id="status">																									
「バーコードをスキャン」を押してください。																									
</div>																									
																									
</div>																									
																									
																									
<div class="card">																									
																									
<div>読み取り結果</div>																									
																									
<div id="result">																									
未読取																									
</div>																									
																									
</div>																									
																									
																									
<div class="card hint">																									
																									
バーコード全体が横向きに入るように、																									
スマホを商品から15〜30cmほど離してください。																									
																									
</div>																									
																									
</div>																									
																									
																									
<script>																									
																									
let scanner = null;																									
let running = false;																									
																									
																									
async function startScanner() {																									
																									
if (running) return;																									
																									
																									
document.getElementById("status").textContent =																									
カメラを起動しています…;																									
																									
																									
try {																									
																									
scanner = new Html5Qrcode(																									
reader,																									
{																									
formatsToSupport: [																									
																									
Html5QrcodeSupportedFormats.UPC_A,																									
																									
Html5QrcodeSupportedFormats.UPC_E,																									
																									
Html5QrcodeSupportedFormats.EAN_13,																									
																									
Html5QrcodeSupportedFormats.EAN_8,																									
																									
Html5QrcodeSupportedFormats.CODE_128,																									
																									
Html5QrcodeSupportedFormats.CODE_39																									
																									
],																									
																									
verbose: false																									
}																									
);																									
																									
																									
const config = {																									
																									
fps: 20,																									
																									
disableFlip: true,																									
																									
aspectRatio: 1.777778,																									
																									
qrbox:																									
function(viewfinderWidth, viewfinderHeight) {																									
																									
return {																									
																									
width:																									
Math.floor(																									
viewfinderWidth * 0.94																									
),																									
																									
height:																									
Math.max(																									
110,																									
Math.floor(																									
viewfinderHeight * 0.28																									
)																									
)																									
																									
};																									
																									
}																									
																									
};																									
																									
																									
await scanner.start(																									
																									
{																									
facingMode: "environment"																									
},																									
																									
config,																									
																									
onScanSuccess,																									
																									
function() {}																									
																									
);																									
																									
																									
running = true;																									
																									
																									
document.getElementById("stopBtn").style.display =																									
block;																									
																									
																									
document.getElementById("status").textContent =																									
バーコードを横向きに、枠いっぱいに合わせてください。;																									
																									
																									
} catch (e) {																									
																									
document.getElementById("status").textContent =																									
カメラ起動エラー： + e;																									
																									
}																									
																									
}																									
																									
																									
async function onScanSuccess(																									
decodedText,																									
decodedResult																									
) {																									
																									
document.getElementById("result").textContent =																									
decodedText;																									
																									
																									
document.getElementById("status").textContent =																									
✅ 読み取り成功;																									
																									
																									
if (navigator.vibrate) {																									
																									
navigator.vibrate(120);																									
																									
}																									
																									
																									
await stopScanner();																									
																									
}																									
																									
																									
async function stopScanner() {																									
																									
if (!scanner || !running) return;																									
																									
																									
try {																									
																									
await scanner.stop();																									
																									
scanner.clear();																									
																									
} catch (e) {}																									
																									
																									
running = false;																									
																									
																									
document.getElementById("stopBtn").style.display =																									
none;																									
																									
}																									
																									
</script>																									
																									
</body>																									
</html>
