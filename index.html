<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">																									
<title>店舗別ピッキング</title>																									
																									
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>																									
																									
<style>																									
body {																									
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;																									
margin: 0;																									
background: #f4f5f7;																									
color: #111;																									
}																									
																									
.wrap {																									
max-width: 720px;																									
margin: 0 auto;																									
padding: 16px;																									
}																									
																									
h1 {																									
text-align: center;																									
font-size: 24px;																									
}																									
																									
.card {																									
background: white;																									
border-radius: 14px;																									
padding: 16px;																									
margin-bottom: 14px;																									
}																									
																									
button {																									
width: 100%;																									
padding: 16px;																									
margin-top: 10px;																									
border: 0;																									
border-radius: 10px;																									
font-size: 18px;																									
font-weight: bold;																									
cursor: pointer;																									
}																									
																									
.start {																									
background: #1976d2;																									
color: white;																									
}																									
																									
.stop {																									
background: #555;																									
color: white;																									
}																									
																									
#reader {																									
width: 100%;																									
margin-top: 14px;																									
overflow: hidden;																									
border-radius: 8px;																									
}																									
																									
#status {																									
margin-top: 12px;																									
padding: 12px;																									
border-radius: 10px;																									
background: #eef1f4;																									
font-size: 15px;																									
font-weight: bold;																									
line-height: 1.4;																									
word-break: break-all;																									
}																									
																									
#result {																									
margin-top: 12px;																									
font-size: 28px;																									
font-weight: 800;																									
word-break: break-all;																									
}																									
																									
/* 商品・店舗表示用の追加スタイル */																									
.product-title {																									
font-size: 22px;																									
font-weight: 800;																									
margin-bottom: 8px;																									
}																									
																									
.info-row {																									
margin-bottom: 4px;																									
font-size: 14px;																									
color: #444;																									
}																									
																									
.total-label {																									
text-align: center;																									
margin-top: 16px;																									
font-weight: bold;																									
color: #555;																									
}																									
																									
.total-qty {																									
font-size: 44px;																									
font-weight: 900;																									
text-align: center;																									
margin: 4px 0 12px;																									
color: #1976d2;																									
}																									
																									
table {																									
width: 100%;																									
border-collapse: collapse;																									
margin-top: 10px;																									
}																									
																									
th, td {																									
padding: 10px 6px;																									
border-bottom: 1px solid #eee;																									
text-align: left;																									
font-size: 14px;																									
}																									
																									
th {																									
background: #f8f9fa;																									
color: #555;																									
}																									
																									
th:last-child, td:last-child {																									
text-align: right;																									
}																									
																									
.qty {																									
font-size: 20px;																									
font-weight: 800;																									
color: #d32f2f;																									
}																									
</style>																									
</head>																									
																									
<body>																									
																									
<div class="wrap">																									
																									
<h1>店舗別ピッキング</h1>																									
																									
<div class="card">																									
<button id="startBtn" class="start" onclick="startScanner()">																									
📷 商品バーコードをスキャン																									
</button>																									
																									
<button																									
id="stopBtn"																									
class="stop"																									
style="display:none"																									
onclick="stopScanner()">																									
カメラを閉じる																									
</button>																									
																									
<div id="reader"></div>																									
																									
<div id="status">																									
「商品バーコードをスキャン」を押してください																									
</div>																									
</div>																									
																									
<div class="card">																									
<div>読み取り結果</div>																									
<div id="result">未読取</div>																									
</div>																									
																									
<!-- 商品データ表示用エリア（初期状態は非表示） -->																									
<div id="productCard" class="card" style="display:none;">																									
<div id="productName" class="product-title"></div>																									
<div class="info-row">商品コード：<strong id="productCode"></strong></div>																									
<div class="info-row">実物バーコード：<strong id="productBarcode"></strong></div>																									
																									
<div class="total-label">本日の出荷合計</div>																									
<div id="totalQty" class="total-qty">0</div>																									
</div>																									
																									
<!-- 店舗一覧表示用エリア（初期状態は非表示） -->																									
<div id="storesCard" class="card" style="display:none;">																									
<h2 style="font-size: 18px; margin: 0 0 10px 0;">出荷店舗一覧</h2>																									
<table>																									
<thead>																									
<tr>																									
<th>No</th>																									
<th>店舗名</th>																									
<th>店番</th>																									
<th style="text-align:right;">数量</th>																									
</tr>																									
</thead>																									
<tbody id="storesBody"></tbody>																									
</table>																									
</div>																									
																									
</div>																									
																									
<script>																									
																									
// GAS API URL																									
const API_URL = "https://script.google.com/macros/s/AKfycbzpTjnexWmyCy4kgopOseUdKh_IAJ9aZpMQXshk-SGYIcp3IUYA9tpX5mgFNYCuKJ_n9g/exec";																									
																									
let scanner = null;																									
let running = false;																									
let callbackCounter = 0;																									
																									
/* ----------------------------------------------------																									
GAS通信用関数（JSONP方式：通信時のエラー回避用）																									
---------------------------------------------------- */																									
function apiGet(params) {																									
return new Promise(function(resolve, reject) {																									
const callbackName = "gasCallback_" + Date.now() + "_" + callbackCounter++;																									
const script = document.createElement("script");																									
																									
const timeout = setTimeout(function() {																									
cleanup();																									
reject(new Error("GASから応答がありません（タイムアウト）"));																									
}, 12000);																									
																									
function cleanup() {																									
clearTimeout(timeout);																									
try { delete window[callbackName]; } catch (e) {}																									
if (script.parentNode) {																									
script.parentNode.removeChild(script);																									
}																									
}																									
																									
window[callbackName] = function(data) {																									
cleanup();																									
resolve(data);																									
};																									
																									
const query = new URLSearchParams();																									
Object.keys(params).forEach(function(key) {																									
query.append(key, params[key]);																									
});																									
query.append("callback", callbackName);																									
																									
script.src = API_URL + "?" + query.toString();																									
script.onerror = function() {																									
cleanup();																									
reject(new Error("GASサーバーに接続できませんでした"));																									
};																									
																									
document.body.appendChild(script);																									
});																									
}																									
																									
/* ----------------------------------------------------																									
カメラ起動（動作確認済みコード完全据え置き）																									
---------------------------------------------------- */																									
async function startScanner() {																									
if (running) return;																									
																									
const statusEl = document.getElementById("status");																									
statusEl.style.color = "#111";																									
statusEl.textContent = "カメラを起動しています…";																									
																									
try {																									
scanner = new Html5Qrcode("reader", {																									
formatsToSupport: [																									
Html5QrcodeSupportedFormats.UPC_A,																									
Html5QrcodeSupportedFormats.UPC_E,																									
Html5QrcodeSupportedFormats.EAN_13,																									
Html5QrcodeSupportedFormats.EAN_8,																									
Html5QrcodeSupportedFormats.CODE_128,																									
Html5QrcodeSupportedFormats.CODE_39																									
],																									
verbose: false																									
});																									
																									
const config = {																									
fps: 20,																									
disableFlip: true,																									
qrbox: {																									
width: 280,																									
height: 120																									
}																									
};																									
																									
await scanner.start(																									
{ facingMode: "environment" },																									
config,																									
onScanSuccess,																									
onScanError																									
);																									
																									
running = true;																									
																									
document.getElementById("startBtn").style.display = "none";																									
document.getElementById("stopBtn").style.display = "block";																									
																									
statusEl.textContent = "バーコードを横向きに、枠内に合わせてください";																									
																									
} catch (error) {																									
console.error("Camera Start Error:", error);																									
																									
statusEl.style.color = "#d32f2f";																									
																									
let errorMessage = "カメラを起動できませんでした。";																									
const errString = error.toString();																									
																									
if (errString.includes("NotAllowedError") || errString.includes("PermissionDeniedError")) {																									
errorMessage = "⚠️ カメラの利用権限が拒否されています。ブラウザの設定でカメラを許可してください。";																									
} else if (errString.includes("NotFoundError") || errString.includes("DevicesNotFoundError")) {																									
errorMessage = "⚠️ カメラが見つかりません。";																									
} else if (errString.includes("NotReadableError") || errString.includes("TrackStartError")) {																									
errorMessage = "⚠️ カメラが他のアプリで使用されている可能性があります。";																									
} else {																									
errorMessage += ` (${error.name || error.message || error})`;																									
}																									
																									
statusEl.textContent = errorMessage;																									
running = false;																									
}																									
}																									
																									
/* ----------------------------------------------------																									
読み取り成功時処理（ここにGAS連携を追加）																									
---------------------------------------------------- */																									
async function onScanSuccess(decodedText) {																									
// 1. スキャン成功の表示・バイブレーション																									
document.getElementById("result").textContent = decodedText;																									
const statusEl = document.getElementById("status");																									
statusEl.style.color = "#2e7d32";																									
statusEl.textContent = "✅ 読み取り成功。商品データを検索中…";																									
																									
if (navigator.vibrate) {																									
navigator.vibrate(150);																									
}																									
																									
// 2. カメラを一旦停止（安定動作用）																									
await stopScanner();																									
																									
// 3. GAS通信とデータ描画																									
try {																									
const data = await apiGet({																									
action: "product",																									
barcode: decodedText																									
});																									
																									
if (!data || !data.success) {																									
document.getElementById("productCard").style.display = "none";																									
document.getElementById("storesCard").style.display = "none";																									
statusEl.style.color = "#d32f2f";																									
statusEl.textContent = "⚠️ " + (data && data.message ? data.message : "未登録の商品です") + "（" + decodedText + "）";																									
return;																									
}																									
																									
// 商品情報の反映																									
document.getElementById("productName").textContent = (data.model || "") + (data.color ? " / " + data.color : "");																									
document.getElementById("productCode").textContent = data.productCode || "";																									
document.getElementById("productBarcode").textContent = data.barcode || decodedText;																									
document.getElementById("totalQty").textContent = data.totalQty || 0;																									
document.getElementById("productCard").style.display = "block";																									
																									
// 店舗一覧の生成・反映																									
const storesBody = document.getElementById("storesBody");																									
storesBody.innerHTML = "";																									
																									
const stores = Array.isArray(data.stores) ? data.stores : [];																									
																									
if (stores.length === 0) {																									
storesBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">本日の出荷データはありません</td></tr>';																									
} else {																									
stores.forEach(function(store) {																									
const tr = document.createElement("tr");																									
																									
const tdNo = document.createElement("td");																									
tdNo.textContent = store.storeNo || "";																									
																									
const tdName = document.createElement("td");																									
tdName.textContent = store.storeName || "";																									
																									
const tdCode = document.createElement("td");																									
tdCode.textContent = store.storeCode || "";																									
																									
const tdQty = document.createElement("td");																									
tdQty.textContent = store.qty || "0";																									
tdQty.className = "qty";																									
																									
tr.appendChild(tdNo);																									
tr.appendChild(tdName);																									
tr.appendChild(tdCode);																									
tr.appendChild(tdQty);																									
																									
storesBody.appendChild(tr);																									
});																									
}																									
																									
document.getElementById("storesCard").style.display = "block";																									
statusEl.style.color = "#2e7d32";																									
statusEl.textContent = "✅ データ取得完了";																									
																									
} catch (error) {																									
statusEl.style.color = "#d32f2f";																									
statusEl.textContent = "❌ エラー: " + (error.message || error);																									
}																									
}																									
																									
function onScanError(errorMessage) {																									
// スキャン途中のエラーは無視																									
}																									
																									
/* ----------------------------------------------------																									
カメラ停止（動作確認済みコード完全据え置き）																									
---------------------------------------------------- */																									
async function stopScanner() {																									
if (!scanner || !running) return;																									
																									
try {																									
await scanner.stop();																									
scanner.clear();																									
} catch (error) {																									
console.error("Stop Error:", error);																									
}																									
																									
running = false;																									
document.getElementById("startBtn").style.display = "block";																									
document.getElementById("stopBtn").style.display = "none";																									
}																									
																									
</script>																									
																									
</body>																									
</html>
