<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<meta name="viewport" content="width=device-width, initial-scale=1">																									
																									
<title>ボタンテスト</title>																									
																									
<style>																									
body {																									
font-family: sans-serif;																									
padding: 30px;																									
}																									
																									
button {																									
width: 100%;																									
padding: 25px;																									
font-size: 24px;																									
background: #1976d2;																									
color: white;																									
border: 0;																									
border-radius: 15px;																									
}																									
																									
#status {																									
margin-top: 30px;																									
padding: 20px;																									
font-size: 24px;																									
font-weight: bold;																									
background: #eee;																									
}																									
</style>																									
</head>																									
																									
<body>																									
																									
<h1>ボタンテスト</h1>																									
																									
<button id="testButton">																									
押してください																									
</button>																									
																									
<div id="status">																									
待機中																									
</div>																									
																									
<script>																									
document.getElementById("testButton").addEventListener("click", function() {																									
document.getElementById("status").textContent = "成功！ボタンが動いています";																									
});																									
</script>																									
																									
</body>																									
</html>
