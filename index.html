<!DOCTYPE html>																									
<html lang="ja">																									
<head>																									
<meta charset="UTF-8">																									
<title>カメラテスト</title>																									
</head>																									
<body style="text-align:center; padding-top:20px;">																									
<button onclick="testCamera()" style="font-size:20px; padding:10px 20px;">カメラテスト実行</button>																									
<div id="status" style="margin:20px; font-weight:bold;"></div>																									
<video id="video" autoplay playsinline style="width:100%; max-width:400px; border:1px solid #ccc;"></video>																									
																									
<script>																									
async function testCamera() {																									
const status = document.getElementById('status');																									
status.textContent = 'カメラ起動中...';																									
try {																									
const stream = await navigator.mediaDevices.getUserMedia({																									
video: { facingMode: "environment" }																									
});																									
document.getElementById('video').srcObject = stream;																									
status.textContent = '✅ カメラの起動に成功しました！';																									
} catch (err) {																									
status.textContent = '❌ エラー発生: ' + err.name + ' - ' + err.message;																									
}																									
}																									
</script>																									
</body>																									
</html>
