																									
<!DOCTYPE html>

<head>

<style>

.btn-sync {

background: #2563eb;

.select-sort {

.status {

background: #dcfce7;

.status.error {

.store-card {																									
border: 2px solid #cbd5e1;

.store-card.done {																									
border-color: #94a3b8;

.store-card.next-target {																									
border: 3px solid #2563eb;

.scanner-wrapper {																									
position: relative;																									
width: 100%;																									
max-height: 380px;																									
background: #000;																									
border-radius: 8px;																									
overflow: hidden;																									
display: flex;																									
justify-content: center;																									
align-items: center;

}																									
																									
video {																									
width: 100% !important;																									
height: auto !important;																									
max-height: 380px;																									
object-fit: cover;																									
display: block;																									
position: relative;																									
z-index: 1;																									
transform-origin: center center;																									
transition: transform 0.1s ease-out;																									
}																									
																									
.camera-controls {																									
display: flex;																									
gap: 8px;																									
margin-top: 8px;																									
}																									
																									
.btn-zoom {																									
flex: 1;																									
background: #334155;																									
color: white;																									
border: none;																									
padding: 10px;																									
border-radius: 8px;																									
font-size: 14px;																									
font-weight: bold;																									
}																									
																									
.btn-zoom.active {																									
background: #2563eb;																									
}																									
																									
.focus-ring {																									
position: absolute;																									
width: 60px;																									
height: 60px;																									
border: 2px solid #fbbf24;																									
border-radius: 50%;																									
transform: translate(-50%, -50%);																									
pointer-events: none;																									
z-index: 25;																									
animation: focusAnim 0.5s ease-out forwards;																									
}																									
																									
@keyframes focusAnim {																									
0% {																									
opacity: 1;																									
transform: translate(-50%, -50%) scale(1.4);																									
}																									
100% {																									
opacity: 0;																									
transform: translate(-50%, -50%) scale(0.8);																									
}																									
}																									
																									
.scan-guide-box {																									
position: absolute;																									
top: 50%;																									
left: 50%;																									
transform: translate(-50%, -50%);																									
width: 78%;																									
height: 120px;																									
pointer-events: none;																									
z-index: 10;																									
display: flex;																									
align-items: center;																									
justify-content: center;																									
}																									
																									
.scan-guide-text {																									
position: absolute;																									
top: 8px;																									
left: 0;																									
right: 0;																									
text-align: center;																									
color: #fff;																									
font-size: 13px;																									
font-weight: bold;																									
text-shadow: 0 1px 3px rgba(0,0,0,0.9);																									
z-index: 12;																									
}																									
																									
.scan-laser {																									
position: absolute;																									
width: 90%;																									
height: 2px;																									
background: #ef4444;																									
box-shadow: 0 0 6px #ef4444;																									
animation: laserMove 2s infinite ease-in-out;																									
z-index: 11;																									
}																									
																									
@keyframes laserMove {																									
0%, 100% { top: 20%; }																									
50% { top: 80%; }																									
}																									
																									
.corner {																									
position: absolute;																									
width: 24px;																									
height: 24px;																									
border-color: #10b981;																									
border-style: solid;																									
border-width: 0;																									
z-index: 11;																									
}																									
																									
.corner-tl {																									
top: 0;																									
left: 0;																									
border-top-width: 4px;																									
border-left-width: 4px;																									
}																									
																									
.corner-tr {																									
top: 0;																									
right: 0;																									
border-top-width: 4px;																									
border-right-width: 4px;																									
}																									
																									
.corner-bl {																									
bottom: 0;																									
left: 0;																									
border-bottom-width: 4px;																									
border-left-width: 4px;																									
}																									
																									
.corner-br {																									
bottom: 0;																									
right: 0;																									
border-bottom-width: 4px;																									
border-right-width: 4px;																									
}																									
																									
.overlay {																									
position: fixed;																									
inset: 0;																									
background: rgba(0,0,0,0.65);																									
z-index: 3000;																									
display: flex;																									
align-items: center;																									
justify-content: center;																									
padding: 18px;																									
}																									
																									
.login-box {																									
background: white;																									
border-radius: 14px;																									
padding: 24px;																									
width: 100%;																									
max-width: 400px;																									
text-align: center;																									
}																									
																									
.login-box h2 {																									
margin: 10px 0 24px;																									
}																									
																									
.login-box p {																									
font-size: 16px;																									
margin-bottom: 18px;																									
}																									
																									
.login-box input {																									
width: 100%;																									
padding: 15px;																									
border: 1px solid #cbd5e1;																									
border-radius: 9px;																									
font-size: 18px;																									
margin-bottom: 14px;																									
}																									
																									
.login-error {																									
color: #dc2626;																									
font-weight: bold;																									
font-size: 14px;																									
margin-bottom: 10px;																									
display: none;																									
}																									
</style>																									
</head>																									
																									
<body>																									
																									
<!-- 作業者名入力 -->																									
<div id="loginOverlay" class="overlay">																									
<div class="login-box">																									
<h2>📦 ピッキング管理</h2>																									
<p>作業者名を入力してください</p>																									
																									
<input																									
type="text"																									
id="workerInput"																									
maxlength="80"																									
placeholder="例：田中"																									
autocomplete="name"																									
>																									
																									
<div id="loginError" class="login-error"></div>																									
																									
<button																									
type="button"																									
id="workerStartButton"																									
class="btn-action-full"																									
>																									
作業開始																									
</button>																									
</div>																									
</div>																									
																									
<div class="worker-bar">																									
<span id="workerLabel">作業者：未設定</span>																									
<button type="button" id="changeWorkerButton">																									
名前変更																									
</button>																									
</div>																									
																									
<div class="top-buttons-container">																									
<button																									
type="button"																									
class="btn-reset-top"																									
onclick="resetAppDataLocally()"																									
>																									
🗑️ リセット																									
</button>																									
																									
<button																									
type="button"																									
class="btn-sync-top"																									
onclick="syncData()"																									
>																									
🔄 反映・更新																									
</button>																									
</div>																									
																									
<div id="status" class="status" style="display:none"></div>																									
																									
<div class="card" id="videoCard" style="display:none">																									
<div id="videoContainer">																									
<div																									
class="scanner-wrapper"																									
id="scannerWrapper"																									
onclick="handleVideoTap(event)"																									
>																									
<video id="video" autoplay playsinline muted></video>																									
																									
<div class="scan-guide-box">																									
<div class="scan-guide-text">																									
枠内にバーコードを合わせてください																									
(タップで再フォーカス)																									
</div>																									
<div class="scan-laser"></div>																									
<div class="corner corner-tl"></div>																									
<div class="corner corner-tr"></div>																									
<div class="corner corner-bl"></div>																									
<div class="corner corner-br"></div>																									
</div>																									
</div>																									
</div>																									
																									
<div class="camera-controls">																									
<button id="zoom1x" class="btn-zoom active"																									
onclick="setZoom(1.0)">1.0x (標準)</button>																									
																									
<button id="zoom15x" class="btn-zoom"																									
onclick="setZoom(1.5)">1.5x</button>																									
																									
<button id="zoom2x" class="btn-zoom"																									
onclick="setZoom(2.0)">2.0x (拡大)</button>																									
</div>																									
																									
<button																									
type="button"																									
onclick="stopScan()"																									
class="btn-sync"																									
style="margin-top:8px;background:#94a3b8;position:relative;z-index:20;"																									
>																									
キャンセル（カメラを閉じる）																									
</button>																									
</div>																									
																									
<div class="card" id="homeProgressCard">																									
<div style="font-weight:bold;font-size:16px;margin-bottom:6px;color:#2563eb;">																									
📋 ピッキング管理																									
</div>																									
																									
<div style="color:#64748b;font-size:14px;line-height:1.5;">																									
下のボタンから「カメラ」または																									
「Bluetoothスキャナー」を選んで																									
バーコードをスキャンしてください。																									
</div>																									
</div>																									
																									
<div id="outArea" class="card" style="display:none">																									
<div style="text-align:center;">																									
<h3 style="margin:0;">商品ピッキング詳細</h3>																									
<div																									
id="itemSub"																									
style="color:#64748b;font-size:12px;margin-bottom:6px;"																									
></div>																									
</div>																									
																									
<hr style="border:0;border-top:1px solid #eee;margin:10px 0;">																									
																									
<div id="storeList"></div>																									
</div>																									
																									
<div class="bottom-btn-container">																									
<select																									
id="sortOrder"																									
class="select-sort"																									
onchange="onSortChange()"																									
>																									
<option value="false">正順 (店舗 1 → 10)</option>																									
<option value="true">逆順 (店舗 10 → 1)</option>																									
</select>																									
																									
<button																									
type="button"																									
class="btn-action-full"																									
onclick="startScan()"																									
>																									
📷 カメラでスキャン開始																									
</button>																									
																									
<button																									
type="button"																									
class="btn-action-scanner"																									
onclick="activateScannerMode()"																									
>																									
📡 スキャナーを使う（Bluetooth）																									
</button>																									
</div>																									
																									
<script>																									
use strict';																									
																									
const GAS_URL =																									
https://script.google.com/macros/s/AKfycbzpTjnexWmyCy4kgopOseUdKh_IAJ9aZpMQXshk-SGYIcp3IUYA9tpX5mgFNYCuKJ_n9g/exec';																									
																									
let codeReader = null;																									
																									
let currentMode = 'OUT_ITEM';																									
let currentData = null;																									
let activeStoreCode = null;																									
let storeCounts = {};																									
let isProcessing = false;																									
let audioCtx = null;																									
let currentZoom = 1.0;																									
																									
let workerName = '';																									
let productWorker = '';																									
let saving = false;																									
let scannerBuffer = '';																									
let scannerTimer = null;																									
let targetScrollTimer = null;																									
																									
function getEl(id) {																									
return document.getElementById(id);																									
}																									
																									
// 作業者名の登録																									
function saveWorker() {																									
const input = getEl('workerInput');																									
const overlay = getEl('loginOverlay');																									
const label = getEl('workerLabel');																									
const error = getEl('loginError');																									
																									
const name = input.value.trim();																									
																									
error.style.display = 'none';																									
																									
if (!name) {																									
error.textContent = '作業者名を入力してください';																									
error.style.display = 'block';																									
return;																									
}																									
																									
if (																									
currentData &&																									
productWorker &&																									
name !== productWorker																									
) {																									
error.textContent =																									
作業中の商品があります。完了後に名前を変更してください。';																									
error.style.display = 'block';																									
return;																									
}																									
																									
workerName = name;																									
																									
try {																									
localStorage.setItem('picking_worker_name', name);																									
} catch (e) {																									
console.warn('名前の端末保存に失敗:', e);																									
}																									
																									
label.textContent = '作業者：' + name;																									
overlay.style.display = 'none';																									
																									
showStatus(																									
作業者「' + name + '」で開始しました。',																									
success'																									
);																									
}																									
																									
function changeWorker() {																									
if (currentData) {																									
alert(																									
作業中の商品があります。完了またはリセット後に名前を変更してください。'																									
);																									
return;																									
}																									
																									
getEl('workerInput').value = workerName;																									
getEl('loginError').style.display = 'none';																									
getEl('loginOverlay').style.display = 'flex';																									
}																									
																									
function initializeApp() {																									
// 名前入力のボタンは直接イベント登録する																									
getEl('workerStartButton').addEventListener(																									
click',																									
saveWorker																									
);																									
																									
getEl('changeWorkerButton').addEventListener(																									
click',																									
changeWorker																									
);																									
																									
getEl('workerInput').addEventListener(																									
keydown',																									
function(event) {																									
if (event.key === 'Enter') {																									
event.preventDefault();																									
saveWorker();																									
}																									
}																									
);																									
																									
try {																									
workerName =																									
localStorage.getItem('picking_worker_name') || '';																									
} catch (e) {																									
workerName = '';																									
}																									
																									
getEl('workerInput').value = workerName;																									
																									
currentZoom = Number(																									
localStorage.getItem('picking_camera_zoom')																									
) || 1;																									
																									
const savedData =																									
localStorage.getItem('picking_current_data');																									
																									
const savedCounts =																									
localStorage.getItem('picking_store_counts');																									
																									
if (savedData && savedCounts) {																									
try {																									
currentData = JSON.parse(savedData);																									
storeCounts = JSON.parse(savedCounts);																									
																									
productWorker =																									
localStorage.getItem('picking_product_worker') ||																									
workerName;																									
																									
getEl('homeProgressCard').style.display = 'none';																									
																									
renderProductData(currentData);																									
																									
if (getNextRequiredStore()) {																									
currentMode = 'OUT_STORE';																									
																									
showStatus(																									
前回の作業データを復元しました。',																									
success'																									
);																									
} else {																									
currentMode = 'OUT_ITEM';																									
																									
showStatus(																									
全店舗の作業が完了しています。反映・更新で保存してください。',																									
error'																									
);																									
}																									
																									
} catch (e) {																									
console.error('復元エラー:', e);																									
currentData = null;																									
storeCounts = {};																									
}																									
}																									
																									
setupBluetoothScannerListener();																									
}																									
																									
if (document.readyState === 'loading') {																									
document.addEventListener(																									
DOMContentLoaded',																									
initializeApp																									
);																									
} else {																									
initializeApp();																									
}																									
																									
function onSortChange() {																									
if (currentData) {																									
currentData.stores.reverse();																									
renderProductData(currentData);																									
}																									
}																									
																									
function setupBluetoothScannerListener() {																									
document.addEventListener('keydown', function(e) {																									
if (																									
getEl('loginOverlay').style.display !== 'none'																									
) {

avgY >= vHeight * 0.35 &&																									
avgY <= vHeight * 0.65																									
) {

}

isProcessing = true;																									
handleScan(result.text);

}																									
}																									
}																									
).catch(function() {																									
stopScan();

// GASからJSONPで応答を取得する																									
function apiRequest(params, timeoutMs) {																									
timeoutMs = timeoutMs || 30000;																									
																									
return new Promise(function(resolve, reject) {																									
const callbackName =																									
pickingCallback_' +																									
Date.now() +																									
_' +																									
Math.floor(Math.random() * 100000000);																									
																									
const script = document.createElement('script');																									
																									
let finished = false;																									
																									
const timer = setTimeout(function() {																									
finish(new Error('通信がタイムアウトしました'));																									
}, timeoutMs);																									
																									
function finish(error, data) {																									
if (finished) return;																									
																									
finished = true;																									
																									
clearTimeout(timer);																									
delete window[callbackName];																									
script.remove();																									
																									
if (error) {																									
reject(error);																									
} else {																									
resolve(data);																									
}																									
}																									
																									
window[callbackName] = function(data) {																									
finish(null, data);																									
};																									
																									
script.onerror = function() {																									
finish(new Error('通信エラーが発生しました'));																									
};																									
																									
const query = new URLSearchParams();																									
																									
Object.keys(params).forEach(function(key) {																									
query.set(key, String(params[key]));																									
});																									
																									
query.set('callback', callbackName);																									
query.set('_t', String(Date.now()));																									
																									
script.src =																									
GAS_URL + '?' + query.toString();																									
																									
document.head.appendChild(script);																									
});																									
}

function playBeep(freq1, freq2, dur) {																									
try {																									
if (!audioCtx) {																									
audioCtx = new (																									
window.AudioContext ||																									
window.webkitAudioContext																									
)();																									
}																									
																									
if (audioCtx.state === 'suspended') {																									
audioCtx.resume();																									
}																									
																									
[																									
[freq1, 0, dur],																									
[freq2, dur + 0.02, dur]																									
].forEach(function(v) {																									
const osc = audioCtx.createOscillator();																									
const g = audioCtx.createGain();																									
																									
osc.frequency.setValueAtTime(																									
v[0],																									
audioCtx.currentTime + v[1]																									
);																									
																									
g.gain.setValueAtTime(																									
0.2,																									
audioCtx.currentTime + v[1]																									
);																									
																									
g.gain.exponentialRampToValueAtTime(																									
0.01,																									
audioCtx.currentTime + v[1] + v[2]																									
);																									
																									
osc.connect(g);																									
g.connect(audioCtx.destination);																									
																									
osc.start(audioCtx.currentTime + v[1]);																									
osc.stop(audioCtx.currentTime + v[1] + v[2]);																									
});																									
																									
} catch (e) {}																									
}

function playBuzzer() {																									
try {																									
if (!audioCtx) {																									
audioCtx = new (																									
window.AudioContext ||																									
window.webkitAudioContext																									
)();																									
}																									
																									
if (audioCtx.state === 'suspended') {																									
audioCtx.resume();																									
}																									
																									
const osc = audioCtx.createOscillator();																									
const g = audioCtx.createGain();																									
																									
osc.type = 'sawtooth';																									
																									
osc.frequency.setValueAtTime(																									
280,																									
audioCtx.currentTime																									
);																									
																									
g.gain.setValueAtTime(																									
0.3,																									
audioCtx.currentTime																									
);																									
																									
g.gain.exponentialRampToValueAtTime(																									
0.01,																									
audioCtx.currentTime + 0.2																									
);																									
																									
osc.connect(g);																									
g.connect(audioCtx.destination);																									
																									
osc.start(audioCtx.currentTime);																									
osc.stop(audioCtx.currentTime + 0.2);																									
																									
} catch (e) {}																									
}

function findStoreCard(storeCode) {																									
const cards =																									
document.querySelectorAll('.store-card');																									
																									
for (let i = 0; i < cards.length; i++) {																									
if (																									
cards[i].dataset.storeCode ===																									
String(storeCode)																									
) {																									
return cards[i];																									
}																									
}																									
																									
return null;																									
}																									
																									
// 青枠の店舗へ自動スクロール																									
function scrollToNextStore() {																									
if (targetScrollTimer) {																									
clearTimeout(targetScrollTimer);																									
}																									
																									
targetScrollTimer = setTimeout(function() {																									
if (!currentData) return;																									
																									
if (																									
getEl('videoCard').style.display === 'block'																									
) {																									
return;																									
}																									
																									
const nextStore = getNextRequiredStore();																									
																									
if (!nextStore) return;																									
																									
const card =																									
findStoreCard(nextStore.storeCode);																									
																									
if (!card) return;																									
																									
const footer = document.querySelector(																									
.bottom-btn-container'																									
);																									
																									
const footerHeight = footer																									
? footer.getBoundingClientRect().height																									
: 0;																									
																									
const availableHeight = Math.max(																									
120,																									
window.innerHeight - footerHeight																									
);																									
																									
const rect = card.getBoundingClientRect();																									
																									
const desiredTop =																									
(availableHeight - rect.height) / 2;																									
																									
const top = Math.max(																									
0,																									
window.scrollY +																									
rect.top -																									
Math.max(12, desiredTop)																									
);																									
																									
window.scrollTo({																									
top: top,																									
behavior: 'smooth'																									
});																									
}, 180);																									
}																									
																									
function updateStoreUI() {																									
if (!currentData) return;																									
																									
const nextStore = getNextRequiredStore();																									
																									
currentData.stores.forEach(function(store) {																									
const card = findStoreCard(store.storeCode);																									
																									
if (!card) return;																									
																									
const count =																									
Number(storeCounts[store.storeCode]) || 0;																									
																									
const countEl = card.querySelector('.count');																									
																									
if (countEl) {																									
countEl.innerText = count;																									
}																									
																									
if (count >= store.qty) {																									
card.className = 'store-card done';																									
																									
} else if (																									
nextStore &&																									
String(store.storeCode) ===																									
String(nextStore.storeCode)																									
) {																									
card.className = 'store-card next-target';																									
																									
} else {																									
card.className = 'store-card';																									
}																									
});																									
																									
scrollToNextStore();																									
}
